# 평일 오전 10시(KST) Discord 데일리 스크럼 알림
# - 주말 / 한국 공휴일은 건너뜁니다.
# - 설정 방법: Wiki "데일리 스크럼 알림" 참고
name: Daily Scrum

on:
  schedule:
    # 매주 월~금 00:40 UTC = 09:40 KST 트리거 → 10:00 KST 까지 대기 후 전송
    # (cron 은 항상 UTC 기준. 정각은 GitHub 혼잡 시간대라 지연이 커서 피함)
    - cron: "40 0 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "주말 / 공휴일에도 전송"
        type: boolean
        default: false
      dry_run:
        description: "전송하지 않고 메시지 내용만 로그로 확인"
        type: boolean
        default: false

concurrency:
  group: daily-scrum
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Discord 스크럼 알림
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GitHub 스케줄은 정각에 몰려 수 시간씩 지연되므로 09:40 KST 에 미리 트리거하고 10:00 KST 까지 대기
      - name: 10:00 KST 까지 대기
        if: github.event_name == 'schedule'
        run: |
          wait=$(( $(TZ=Asia/Seoul date -d '10:00' +%s) - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "10:00 KST 까지 ${wait}초 대기"
            sleep "$wait"
          fi

      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --quiet holidays

      - name: Send daily scrum message
        env:
          DISCORD_SCRUM_WEBHOOK: ${{ secrets.DISCORD_SCRUM_WEBHOOK }}
          PROJECT_READ_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/daily_scrum.py
