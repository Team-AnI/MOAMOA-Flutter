# 평일 오전 10시(KST) 리뷰 대기 PR Discord 리마인드
# - 하루 1회, 아직 머지되지 않은 PR 전체를 메시지 하나로 모아 리뷰 요청합니다.
# - 주말 / 한국 공휴일은 건너뜁니다.
# - 설정: 레포 시크릿 DISCORD_GITHUB_WEBHOOK (PR Notify 와 같은 채널)
name: Review Reminder

on:
  schedule:
    # 매주 월~금 00:40 UTC = 09:40 KST 트리거 → 10:00 KST 까지 대기 후 전송
    # (cron 은 항상 UTC 기준. 정각은 GitHub 혼잡 시간대라 지연이 커서 피함)
    - cron: "40 0 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "주말 / 공휴일에도 전송"
        type: boolean
        default: false
      dry_run:
        description: "전송하지 않고 메시지 내용만 로그로 확인"
        type: boolean
        default: false

concurrency:
  group: review-reminder
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  remind:
    name: Discord 리뷰 리마인드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GitHub 스케줄은 정각에 몰려 수 시간씩 지연되므로 09:40 KST 에 미리 트리거하고 10:00 KST 까지 대기
      - name: 10:00 KST 까지 대기
        if: github.event_name == 'schedule'
        run: |
          wait=$(( $(TZ=Asia/Seoul date -d '10:00' +%s) - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "10:00 KST 까지 ${wait}초 대기"
            sleep "$wait"
          fi

      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --quiet holidays

      - name: Send review reminder
        env:
          DISCORD_GITHUB_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/review_reminder.py
