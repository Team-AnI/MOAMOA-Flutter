# 웹 배포: release 브랜치에 push 하면 Firebase Hosting(live)에 배포합니다.
# - 순서: 포맷 / 정적 분석 / 테스트 → 웹 빌드 → 배포 (하나라도 실패하면 배포하지 않음)
# - 설정: 레포 시크릿 FIREBASE_SERVICE_ACCOUNT_MOAMOA_129CD (배포용 서비스 계정 키)
#         레포 변수 API_BASE_URL (서버 주소, https)
# - 수동 실행(workflow_dispatch)도 release 브랜치에서만 배포합니다.
name: Deploy Web

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

# 배포가 겹치면 이전 실행은 취소하고 마지막 push 만 배포
concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ci.yml 의 FLUTTER_VERSION 과 함께 갱신
  FLUTTER_VERSION: "3.47.8"

jobs:
  deploy:
    name: Build / Deploy
    # 포크에는 시크릿이 없으므로 팀 저장소의 release 브랜치에서만 실행
    if: github.repository == 'Team-AnI/MOAMOA-Flutter' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOAMOA_129CD }}
          projectId: moamoa-129cd
          channelId: live
